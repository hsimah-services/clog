name: Package Clog Plugin Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_GRAPHQL_URL: /graphql

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist/
          include-hidden-files: true

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Teardown previous run
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml down -v 2>/dev/null || true

      - name: Start WordPress stack
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml up -d --build

      - name: Wait for WordPress setup
        working-directory: .
        run: |
          echo "Waiting for WordPress and plugins..."
          for i in $(seq 1 30); do
            if docker compose -f .github/workflows/e2e-tests/docker-compose.yml exec -T wordpress wp plugin is-active clog --allow-root 2>/dev/null; then
              echo "WordPress is ready and clog plugin is active"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done
          echo "WordPress setup failed"
          docker compose -f .github/workflows/e2e-tests/docker-compose.yml logs wordpress
          exit 1

      - name: Seed test data
        working-directory: .
        run: >
          docker compose -f .github/workflows/e2e-tests/docker-compose.yml
          exec -T wordpress wp clog seed --allow-root

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          VITE_GRAPHQL_URL: http://localhost:6060/graphql
          WP_ADMIN_USER: testadmin
          WP_ADMIN_PASSWORD: testpassword
        run: npm run test:e2e

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: .
        run: docker compose -f .github/workflows/e2e-tests/docker-compose.yml down -v

  package:
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: server/dist/

      - name: Install PHP dependencies
        run: >
          docker run --rm -v "$PWD/server:/app" -u "$(id -u):$(id -g)"
          -e COMPOSER_HOME=/tmp/composer composer:2
          install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # WordPress's Plugins page reads this header as the "installed version"
      # and compares it against the release tag to decide whether an update
      # is available — it has to match the tag exactly.
      - name: Stamp plugin version from release tag
        if: github.event_name == 'release'
        run: |
          sed -i "s/^ \* Version: .*/ * Version: ${{ github.event.release.tag_name }}/" server/clog.php

      - name: Build plugin zip
        run: |
          mkdir -p build/clog
          cp -a server/. build/clog/
          (cd build && zip -rq ../clog.zip clog)

      # Attaching to the release is what lets the self-hosted update checker
      # (server/includes/updates.php) find it — WordPress downloads this
      # asset when someone clicks "Update Now" on the Plugins page.
      - name: Attach zip to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" clog.zip --clobber

      - name: Upload zip as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: clog-plugin
          path: clog.zip
