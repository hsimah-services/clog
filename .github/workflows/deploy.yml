name: Deploy Clog Plugin to Pupyrus

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_GRAPHQL_URL: /graphql

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist/

  deploy:
    runs-on: [self-hosted, space-needle]
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: server/plugins/clog/dist/

      - name: Remove old plugin from container
        run: docker exec pupyrus rm -rf /var/www/html/wp-content/plugins/clog

      - name: Copy plugin to container
        run: docker cp server/plugins/clog pupyrus:/var/www/html/wp-content/plugins/clog

      - name: Activate plugin
        run: |
          docker compose -f /opt/pupyrus/docker-compose.yml \
            --profile cli run --rm cli wp plugin activate clog --allow-root

      - name: Flush rewrite rules
        run: |
          docker compose -f /opt/pupyrus/docker-compose.yml \
            --profile cli run --rm cli wp rewrite flush --allow-root

      - name: Verify plugin status
        run: |
          docker compose -f /opt/pupyrus/docker-compose.yml \
            --profile cli run --rm cli wp plugin status clog --allow-root