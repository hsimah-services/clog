name: Playwright E2E Tests

on:
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: client

jobs:
  e2e-tests:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Teardown previous run
        working-directory: .
        run: docker compose -f .docker/iditarod/test/docker-compose.yml down -v 2>/dev/null || true

      - name: Start WordPress stack
        working-directory: .
        run: docker compose -f .docker/iditarod/test/docker-compose.yml up -d --build

      - name: Wait for WordPress GraphQL
        working-directory: .
        run: |
          echo "Waiting for GraphQL endpoint..."
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:6060/graphql; then
              echo "GraphQL is ready"
              exit 0
            fi
            echo "Attempt $i/20 - waiting 5s..."
            sleep 5
          done
          echo "WordPress failed to start"
          docker compose -f .docker/iditarod/test/docker-compose.yml logs wordpress
          exit 1

      - name: Activate plugins
        working-directory: .
        run: >
          docker compose -f .docker/iditarod/test/docker-compose.yml
          exec -T wordpress wp plugin activate --all --allow-root

      - name: Seed test data
        working-directory: .
        run: >
          docker compose -f .docker/iditarod/test/docker-compose.yml
          exec -T wordpress wp clog seed --allow-root

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          WP_ADMIN_USER: testadmin
          WP_ADMIN_PASSWORD: testpassword
        run: npm run test:e2e

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Teardown
        if: always()
        working-directory: .
        run: docker compose -f .docker/iditarod/test/docker-compose.yml down -v
