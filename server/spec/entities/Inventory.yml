entity: Inventory
description: One stocked instance of an item, in a location.
use:
  - ClogPost
configure:
  ClogPost:
    visibility: private
    adminMenu: clog
    label: Inventory Entry
    pluralLabel: Inventory
integrations:
  wpgraphql:
    singular: ClogInventory
    plural: ClogInventoryEntries
storage:
  table: inventory
  handle: clog_inventory
fields:
  name:
    type: string
    description: Projected to post_title, so the admin list has something to show.
    required: true
    maxLength: 200
  dateAdded:
    type: datetime
    description: When this instance entered inventory.
    required: true
edges:
  item:
    to: Item
    cardinality: one
    description: What this entry is an instance of.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: cascade
  location:
    to: Location
    cardinality: one
    description: Where it is kept.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: restrict
